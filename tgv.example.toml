version = 1
listen = "127.0.0.1:8787"
# Relative paths are resolved beside this config file.
# data_dir = "./tgv-data"
anthropic_base_url = "https://api.anthropic.com"
codex_base_url = "https://chatgpt.com/backend-api/codex"
# Public Responses endpoint used by Pi's openai provider (including ChatGPT sign-in).
openai_base_url = "https://api.openai.com"
max_concurrent_requests = 32
connect_timeout_seconds = 10
response_header_timeout_seconds = 120
stream_idle_timeout_seconds = 120

[capture]
# Queue slots for body data; lifecycle records have their own reserved slots.
queue_capacity = 1024
# Body bytes held between capture and commit. Overflow is omitted and counted.
queue_bytes = 67108864 # 64 MiB
# Maximum captured prefix per direction, not a forwarding/body-size limit.
# Set to 0 for metadata only. Bodies may contain private prompts and tool output.
body_limit_bytes = 16777216 # 16 MiB
# Longest time a record waits before its batch commits.
commit_interval_ms = 50

[retention]
# Removes whole, finished calls, oldest first. Set false to keep everything.
enabled = true
max_age_seconds = 604800 # 7 days, measured from call start
max_calls = 10000
# Disk pages in use across tgv.sqlite3 and blobs.sqlite3, plus the search
# index's share for retained calls. Bodies are deduplicated, so deleting a
# call frees only chunks nothing else references.
max_storage_bytes = 2147483648 # 2 GiB

[websocket]
# "relay" forwards Codex Responses over WebSocket; "refuse" answers the
# handshake with 426, and Codex falls back to HTTP/SSE for the session.
mode = "relay"
# Upgraded sockets open at once; more handshakes are refused with 426. Each
# call on a socket still counts against max_concurrent_requests.
max_channels = 16

[buffer]
# Bytes held by all buffered requests; past it, new requests get 503. A
# ceiling on memory in use, not a reservation.
budget_bytes = 1073741824 # 1 GiB
idle_timeout_seconds = 30
total_timeout_seconds = 300

# Requests are buffered whole before forwarding; larger ones get 413. Defaults
# are the providers' documented limits. Each must be at most budget_bytes.
[buffer.request_limits]
anthropic = 33554432 # 32 MiB (Anthropic Messages: 32 MB)
codex = 536870912 # 512 MiB (no documented limit; OpenAI's is used)
openai = 536870912 # 512 MiB (OpenAI: 512 MB per request)

[control]
# Tailscale logins allowed to use the control API through Tailscale Serve.
# Local use (the tgv control CLI) needs the daemon's control.token instead.
tailscale_logins = []

# Optional: an operator-key upstream and a fallback to it (opt-in, bills per
# token). The key is read from the daemon's environment, never this file.
# [[upstreams]]
# id = "anthropic-key"
# provider = "anthropic"
# base_url = "https://api.anthropic.com"
# operator_key_env = "TGV_ANTHROPIC_API_KEY"
#
# [[policy.fallback]]
# id = "plan-limit"
# provider = "anthropic"
# to = "anthropic-key"
# on_status = [429]
#
# [[policy.block]]
# id = "no-opus"
# match = { provider = "anthropic", model = "claude-opus-4-1" }
# reason = "not on this gateway"
#
# [[policy.transform]]
# id = "drop-temperature"
# match = { endpoint = "messages" }
# steps = [{ op = "json_remove", path = "/temperature" }]
# reason = "example"
