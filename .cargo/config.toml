# `cargo xtask <task>`: repository tasks written in Rust (xtask/). Release
# profile, so the tasks share dependency builds with the release binary.
[alias]
xtask = "run --release --locked --package xtask --"

# ts-rs writes each `#[ts(export)]` type to the UI when `cargo test` runs;
# CI fails if the committed files differ. 64-bit integers are `number`,
# as the UI's decoders read them, not `bigint`.
[env]
TS_RS_EXPORT_DIR = { value = "ui/apps/web/src/lib/wire", relative = true }
TS_RS_LARGE_INT = "number"
TS_RS_IMPORT_EXTENSION = "ts"
