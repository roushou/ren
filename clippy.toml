# Ambient capabilities are passed in as values (Clock, IdSource, HostEnv, task
# spawning in the shell). The workspace denies `clippy::disallowed_methods`; only
# the capability implementations themselves are exempt, with
# `#[expect(clippy::disallowed_methods, reason = "...")]`.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "read time through ren_recorder::time::Clock" },
  { path = "std::time::Instant::now", reason = "read time through ren_recorder::time::Clock" },
  { path = "tokio::time::Instant::now", reason = "read time through ren_recorder::time::Clock" },
  { path = "uuid::Uuid::new_v4", reason = "generate identities through ren_recorder::id::IdSource" },
  { path = "std::env::var", reason = "read the environment once into HostEnv in main" },
  { path = "std::env::var_os", reason = "read the environment once into HostEnv in main" },
  { path = "std::env::vars", reason = "read the environment once into HostEnv in main" },
  { path = "std::env::vars_os", reason = "read the environment once into HostEnv in main" },
  { path = "tokio::spawn", reason = "spawn tasks in the shell (daemon wiring), not in components" },
  { path = "tokio::task::spawn", reason = "spawn tasks in the shell (daemon wiring), not in components" },
  { path = "std::process::Command::spawn", reason = "start agent processes through ren_supervisor::AgentHost" },
  { path = "tokio::process::Command::spawn", reason = "start agent processes through ren_supervisor::AgentHost" },
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
