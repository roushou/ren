[workspace]
members = [
  "crates/tgv-cli",
  "crates/tgv-daemon",
  "crates/tgv-gateway",
  "crates/tgv-harness",
  "crates/tgv-protocol",
  "crates/tgv-recorder",
  "crates/tgv-store",
]
default-members = [
  "crates/tgv-cli",
  "crates/tgv-daemon",
  "crates/tgv-gateway",
  "crates/tgv-harness",
  "crates/tgv-protocol",
  "crates/tgv-recorder",
  "crates/tgv-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Dependencies used by more than one crate, and our own crates. Each crate
# inherits these with `workspace = true` and adds its own features.
[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1.12"
flate2 = "1.1"
futures-util = "0.3"
http = "1.5"
proptest = { version = "1", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_with = { version = "3.24", default-features = false, features = ["macros"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
tgv-daemon = { path = "crates/tgv-daemon" }
tgv-gateway = { path = "crates/tgv-gateway" }
tgv-harness = { path = "crates/tgv-harness" }
tgv-protocol = { path = "crates/tgv-protocol" }
tgv-recorder = { path = "crates/tgv-recorder" }
tgv-store = { path = "crates/tgv-store" }
thiserror = "2.0"
tokio = "1.54"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1.29", features = ["serde"] }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The design rules (AGENTS.md section 2), enforced for every target. The
# ambient calls listed in clippy.toml are allowed only in the capability
# implementations, each with `#[expect(clippy::disallowed_methods, reason)]`.
as_conversions = "deny"
disallowed_methods = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
match_wildcard_for_single_variants = "deny"
panic = "deny"
# One module layout: a module with submodules lives in `name/mod.rs`, never
# `name.rs` beside a `name/` directory.
self_named_module_files = "deny"
struct_excessive_bools = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
