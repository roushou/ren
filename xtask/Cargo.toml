[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

# Repository tasks run with `cargo xtask` (.cargo/config.toml): host setup
# from a checkout, never shipped. It is a shell: it runs cargo, systemctl,
# loginctl, the built tgv, and tailscale, and reads configuration through
# tgv-daemon's own parser.
[dependencies]
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tgv-daemon.workspace = true
tgv-gateway.workspace = true
tgv-harness.workspace = true
tgv-protocol.workspace = true
tgv-recorder.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
toml.workspace = true

[lints]
workspace = true
