[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

# Repository tasks run with `cargo xtask` (.cargo/config.toml): host setup
# from a checkout, never shipped. It is a shell: it runs cargo, systemctl,
# loginctl, the built ren, and tailscale, and reads configuration through
# ren-daemon's own parser.
[dependencies]
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
ren-daemon.workspace = true
ren-gateway.workspace = true
ren-harness.workspace = true
ren-protocol.workspace = true
ren-recorder.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite.workspace = true
toml.workspace = true

[lints]
workspace = true
