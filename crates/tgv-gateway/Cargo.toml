[package]
name = "tgv-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# TGV's HTTP interface: forwarding, management, and controls. Management uses
# the store's Reader and Backup; SQL stays in tgv-store. State machines and
# decisions stay pure (src/purity.rs). Never add a database driver or CLI parser
# (docs/architecture.md).
[dependencies]
axum.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util.workspace = true
h2 = "0.4.20"
http.workspace = true
http-body = "1.1"
http-body-util = "0.1.5"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
strum.workspace = true
sync_wrapper = { version = "1.0", features = ["futures"] }
tgv-harness.workspace = true
tgv-protocol.workspace = true
tgv-recorder.workspace = true
tgv-store.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml.workspace = true

[lints]
workspace = true
