[package]
name = "ren-tui"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ren in the terminal: the wall of live sessions and the console for agent runs."

# Never add an HTTP client, database driver, or CLI parser; only the terminal
# module touches the terminal, and src/purity.rs keeps the rest pure
# (docs/architecture.md).
[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
ren-harness.workspace = true
ren-protocol.workspace = true
ren-recorder.workspace = true
ren-store.workspace = true
ren-supervisor.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
strum.workspace = true
thiserror.workspace = true
unicode-width = "0.2"
uuid.workspace = true

[lints]
workspace = true
