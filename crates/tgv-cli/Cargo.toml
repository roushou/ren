[package]
name = "tgv-rs"
version.workspace = true
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
homepage.workspace = true
keywords = ["llm", "gateway", "proxy", "claude", "codex"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
description = "TGV: a personal LLM gateway for Claude Code, Codex, and Pi that forwards and records native provider traffic."

# The `tgv` binary: command-line parsing and dispatch, doctor, and service
# definitions. `anyhow` is used only here (docs/architecture.md).
# Published as `tgv-rs` (the `tgv` name is taken on crates.io); the library
# keeps its role name and the binary stays `tgv`.
[lib]
name = "tgv_cli"
path = "src/lib.rs"

[[bin]]
name = "tgv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tgv-daemon.workspace = true
tgv-gateway.workspace = true
tgv-harness.workspace = true
tgv-protocol.workspace = true
tgv-recorder.workspace = true
tgv-store.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
