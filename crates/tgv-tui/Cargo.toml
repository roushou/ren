[package]
name = "tgv-tui"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A terminal view of a TGV gateway's live sessions: one pane per session, as its calls stream."

# The terminal view of live sessions. Its core (`Tui`, the `Wall` it
# builds) reads views and live events and returns the reads it needs; it
# performs no I/O (`src/purity.rs`). `draw` renders a wall into a ratatui
# buffer; `Screen` alone touches the terminal (docs/architecture.md).
[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
tgv-harness.workspace = true
tgv-protocol.workspace = true
tgv-recorder.workspace = true
tgv-store.workspace = true
thiserror.workspace = true
unicode-width = "0.2"

[dev-dependencies]
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
