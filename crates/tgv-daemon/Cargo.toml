[package]
name = "tgv-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Configuration, resource wiring, and service lifecycle. It holds the host's
# clock and random IDs and the daemon's task spawns; HTTP handling belongs to
# tgv-gateway (docs/architecture.md).
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tgv-gateway.workspace = true
tgv-harness.workspace = true
tgv-protocol.workspace = true
tgv-recorder.workspace = true
tgv-store.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
reqwest.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints]
workspace = true
